<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Strike Desk</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ffd447'/%3E%3Cpath d='M7 21l6-7 5 5 8-10M20 9h6v6' fill='none' stroke='%2314112a' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />
    <meta name="theme-color" content="#14112a" />
    <!--
      The order the browser resolves the cascade in, weakest first. The
      stylesheet says the same thing, but a build is free to rewrite a
      statement whose names it can see are already in that order, and it
      does. Saying it here, before the stylesheet loads, fixes the order in
      the page itself, where nothing rewrites it and anyone can read it.
      `ag-grid` is the layer the table writes its own styles into: after the
      reset, so the reset can never reach inside the table, and before the
      utilities, so a utility always can.
    -->
    <style>@layer theme, base, ag-grid, components, utilities;</style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
